services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    command:
      - --encryptionEnv=PB_ENCRYPTION_KEY
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    environment:
      PB_ENCRYPTION_KEY: ""
    ports:
      - "8090:8090"
    volumes:
      - /var/data/pocketbase/pb_data:/pb_data
      - ../pb_public:/pb_public
      - ../pb_migrations:/pb_migrations
      - ../pb_hooks:/pb_hooks
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: pocketbase-api:latest
    container_name: pocketbase-api
    ports:
      - "8889:8888"
    restart: unless-stopped
    environment:
      PB_URL: http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: pocketbase-swagger
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../swagger/openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml
