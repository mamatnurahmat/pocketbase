services:

  api:
    build: ./api
    container_name: pocketbase-api
    ports:
      - "8888:8888"
    restart: unless-stopped
    environment:
      PB_URL: http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy

  # Client v2 (SvelteKit 5 + adapter-static) — build ke pb_public.
  # Output default `build/` disalin ke volume pb_public yang di-mount ke PocketBase.
  # node_modules & .svelte-kit pakai volume anonim agar tidak ketimpa binding host
  # (mis. arch beda), mengikuti pola docker-compose.dev.yml.
  client:
    image: node:22-alpine
    container_name: pocketbase-client-v2
    working_dir: /app
    volumes:
      - ./client-v2:/app
      - ./pb_public:/pb_public
      - client_v2_node_modules:/app/node_modules
      - client_v2_svelte_kit:/app/.svelte-kit
      - client_v2_pnpm_store:/pnpm-store
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile --store-dir=/pnpm-store &&
             pnpm build &&
             find /pb_public -mindepth 1 -delete &&
             cp -r build/. /pb_public/"
    restart: "no"

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    command:
      - --encryptionEnv=PB_ENCRYPTION_KEY
      - --migrationsDir=/pb_migrations
      - --hooksDir=/pb_hooks
    environment:
      PB_ENCRYPTION_KEY: "" # optional
    ports:
      - "8090:8090"
    volumes:
      - /var/data/pocketbase/pb_data:/pb_data
      - ./pb_public:/pb_public
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
    depends_on:
      client:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: pocketbase-swagger
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./swagger/openapi.yaml:/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /openapi.yaml

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /var/data/pocketbase/caddy_data:/data
      - /var/data/pocketbase/caddy_config:/config
    depends_on:
      - pocketbase
      - swagger-ui

volumes:
  client_v2_node_modules:
  client_v2_svelte_kit:
  client_v2_pnpm_store:
