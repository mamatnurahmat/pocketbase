charset utf-8;

tcp_nopush on;
tcp_nodelay off;
client_header_timeout 10s;
client_body_timeout 10s;
client_max_body_size 128k;
reset_timedout_connection on;

gzip on;
gzip_types
    text/css
    text/javascript
    text/xml
    text/plain
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    font/truetype
    font/opentype
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect relatif: jangan sertakan host/port absolut, agar tetap benar
    # saat container di-expose di port non-80 (mis. 8111).
    absolute_redirect off;

    # Service worker & file PWA: jangan di-cache lama
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Asset ber-hash dari Vite: cache agresif
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # SPA fallback (adapter-static fallback: index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
