# Docker Compose — Development Mode (Hot Reload + Debug)
# ======================================================
# Stack: SvelteKit 5 + Vite + pnpm + Node Inspector
#
# Fitur:
#   - Hot reload (HMR) via bind mount + polling
#   - Node Inspector (Chrome DevTools) di port 9229
#   - Env PUBLIC_* ter-expose via vite.config.ts (envPrefix)
#   - Volume anonim untuk node_modules & .svelte-kit
#   - Join network `waf-network` agar bisa di-resolve oleh
#     reverse proxy Caddy (caddy-waf) → dev.sawangan.web.id
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml up -d --build   # detached
#
# Debug (Chrome DevTools):
#   chrome://inspect → Configure → tambah localhost:9229 → Inspect
#
# Troubleshoot:
#   docker compose -f docker-compose.dev.yml logs -f web

services:
  web:
    platform: ${PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: warga-p2s-client-dev
    working_dir: /app

    volumes:
      # Bind mount source code agar perubahan langsung terdeteksi (hot reload)
      - .:/app
      # Volume anonim: node_modules & build cache tetap milik container,
      # supaya tidak ketiban binding dari host (mis. beda arsitektur)
      - client_node_modules:/app/node_modules
      - client_svelte_kit:/app/.svelte-kit
      # pnpm store agar install ulang jauh lebih cepat
      - client_pnpm_store:/pnpm-store

    environment:
      # Vite dev server bind ke 0.0.0.0 agar bisa diakses dari host
      HOST: 0.0.0.0
      PORT: "5173"

      # Polling wajib untuk hot reload di Docker bind-mount (macOS/Windows),
      # karena event inotify tidak menembus VM Docker.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"

      # Env public — dibaca `import.meta.env.PUBLIC_*` (lihat envPrefix di vite.config.ts)
      PUBLIC_PB_URL: ${PUBLIC_PB_URL:-https://prestige2.sawangan.web.id}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.sawangan.web.id}

      # Node Inspector (Chrome DevTools / VS Code attach)
      NODE_OPTIONS: "--inspect=0.0.0.0:9229"

    ports:
      - "5173:5173" # Vite dev server
      - "9229:9229" # Node Inspector (debug)

    # Dependensi di-install saat start (bukan saat build) karena /app
    # di-bind-mount dari host dan menimpa isi image. Cache di pnpm-store
    # membuat install berikutnya cepat.
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"

    # Supaya container bisa di-attach debugger & Ctrl+C bersih
    stdin_open: true
    tty: true

    networks:
      - waf-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  waf-network:
    external: true

volumes:
  client_node_modules:
  client_svelte_kit:
  client_pnpm_store:
